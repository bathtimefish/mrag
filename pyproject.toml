[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mrag"
version = "0.16.0"
description = "Micro RAG — A lightweight, local-first retrieval runtime"
license = { text = "AGPL-3.0" }
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "pydantic>=2",
    "pymupdf>=1.24",
    "qdrant-client>=1.9",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
vaporetto = ["apsw>=3.43"]
reranker = ["sentence-transformers>=3.0"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
mrag = "mrag.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["mrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
