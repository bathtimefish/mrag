<body>
<h1>Pantry handbook</h1>
<section id="terms"><h2>Terms</h2>
<dl>
  <div id="def-jar"><dt><dfn id="term-jar">jar</dfn></dt><dd>A glass container with a lid.</dd></div>
</dl>
</section>
<section id="shelves"><h2>Shelves</h2>
<p id="intro">Every <a href="#term-jar">jar</a> sits on a shelf. See <a href="#stock">the stock table</a> and <a href="#gone">the old list</a>.</p>
<ol start="3">
  <li id="rule-3">Wipe the shelf.
    <ul><li>Use a dry cloth.</li></ul>
  </li>
  <li>Label each jar.</li>
</ol>
<figure id="fig-stock">
<figcaption id="stock">Stock by shelf</figcaption>
<table id="stock-spring">
<caption>Spring</caption>
<thead>
<tr><th rowspan="2">Shelf</th><th rowspan="2">Row</th><th colspan="2">Jars</th></tr>
<tr><th>Full</th><th>Empty</th></tr>
</thead>
<tbody>
<tr><th rowspan="2">Upper</th><th>Front</th><td>seven<a href="#note-a">a)</a></td><td>two</td></tr>
<tr><th>Back</th><td colspan="2">ask the keeper<br>each week</td></tr>
</tbody>
</table>
<p id="note-a" role="note">a) Counted on the first day.</p>
</figure>
<p>A <dfn>crate</dfn> here means a wooden box of twelve jars.</p>
</section>
